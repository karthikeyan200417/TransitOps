services:
  # 1. PostgreSQL 17 Database
  db:
    image: postgres:17
    container_name: transitops_db
    restart: always
    environment:
      POSTGRES_USER: transitops_user
      POSTGRES_PASSWORD: transitops_password
      POSTGRES_DB: transitops_db
    ports:
      - "5433:5432" # Maps host port 5433 to container port 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transitops_user -d transitops_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - transitops-network

  # 2. FastAPI Backend
  backend:
    build:
      context: ./Backend
    container_name: transitops_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=transitops_user
      - POSTGRES_PASSWORD=transitops_password
      - POSTGRES_HOST=db       # Internal container network routing
      - POSTGRES_PORT=5432     # Internal database port
      - POSTGRES_DB=transitops_db
    depends_on:
      db:
        condition: service_healthy # Starts backend ONLY after PostgreSQL is fully loaded
    networks:
      - transitops-network

  # 3. Vite Frontend
  frontend:
    build:
      context: ./Frontend
    container_name: transitops_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1 # Vite calls backend on localhost
    depends_on:
      - backend
    networks:
      - transitops-network

volumes:
  postgres_data:

networks:
  transitops-network:
    driver: bridge
